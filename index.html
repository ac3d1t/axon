<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oculon</title>
    
    <!-- Replace the href below with your exact base64 string from the Oculon snippet -->
    <link rel="icon" type="image/png" href="data:image/png;base64,YOUR_BASE64_STRING_HERE" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <script>
        // --- 1. CONFIGURATION ---
        const CONFIG = {
            imageUrl: 'fenn_2.png', // Updated to use the provided source image
            particleSize: 3,
            particleSpacing: 4,
            transitionDuration: 1000, // in milliseconds
            mouseRepulsion: 80,
            returnSpeed: 0.1,
            shape: 'circle' // 'circle' or 'square'
        };

        // --- 2. CANVAS SETUP ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: undefined, y: undefined, radius: CONFIG.mouseRepulsion };

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- 3. EVENT LISTENERS ---
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init(); // Reinitialize on resize
        });

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // --- 4. PARTICLE CLASS ---
        class Particle {
            constructor(x, y, color) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.baseX = x;
                this.baseY = y;
                this.color = color;
                this.size = CONFIG.particleSize;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (CONFIG.shape === 'circle') {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                }
            }

            update() {
                // Mouse repulsion logic
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let force = (mouse.radius - distance) / mouse.radius;
                
                let directionX = forceDirectionX * force * 5;
                let directionY = forceDirectionY * force * 5;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    // Return to base position
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx * CONFIG.returnSpeed;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy * CONFIG.returnSpeed;
                    }
                }
                this.draw();
            }
        }

        // --- 5. INITIALIZATION & IMAGE PROCESSING ---
        function init() {
            particles = [];
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = CONFIG.imageUrl;

            img.onload = () => {
                // Draw image to a temporary canvas to read pixel data
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                // Scale image to fit within the screen reasonably
                let scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.8;
                tempCanvas.width = img.width * scale;
                tempCanvas.height = img.height * scale;
                
                tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                const data = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                
                // Calculate offsets to center the image on the main canvas
                const offsetX = (canvas.width - tempCanvas.width) / 2;
                const offsetY = (canvas.height - tempCanvas.height) / 2;

                // Create particles based on pixel data
                for (let y = 0; y < data.height; y += CONFIG.particleSpacing) {
                    for (let x = 0; x < data.width; x += CONFIG.particleSpacing) {
                        let index = (y * data.width + x) * 4;
                        let r = data.data[index];
                        let g = data.data[index + 1];
                        let b = data.data[index + 2];
                        let a = data.data[index + 3];

                        if (a > 128) { // Only create particles for non-transparent pixels
                            let color = `rgb(${r}, ${g}, ${b})`;
                            particles.push(new Particle(x + offsetX, y + offsetY, color));
                        }
                    }
                }
            };
            
            // Fallback if image fails to load
            img.onerror = () => {
                console.warn("Image failed to load. Drawing fallback text.");
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.fillText("Failed to load fenn_2.png", 50, canvas.height/2);
            }
        }

        // --- 6. ANIMATION LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            requestAnimationFrame(animate);
        }

        // Start
        init();
        animate();
    </script>
</body>
</html>
